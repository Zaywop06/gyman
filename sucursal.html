<!doctype html>
<html lang="es" class="light dark">
  <head>
    <meta charset="UTF-8" />
    <title>Modificar Sucursal - PWA DataCat</title>

    <script src="js/registraServiceWorker.js"></script>

    <meta name="viewport" content="width=device-width" />
    <meta name="theme-color" content="#4caf50" />
    <link rel="icon" sizes="32x32" href="favicon.ico" />
    <link rel="manifest" href="site.webmanifest" />
    <script src="ungap/custom-elements.js"></script>

    <script type="module" src="js/configura.js"></script>
    <link rel="stylesheet" href="css/estilos.css" />

    <script type="module" src="lib/js/consumeJson.js"></script>
    <script type="module" src="lib/js/muestraObjeto.js"></script>
    <script type="module" src="lib/js/muestraError.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <script>
      // Obtiene los parámetros de la página.
      const params = new URL(location.href).searchParams;
    </script>
  </head>

  <body
    onload="
      if (params.size > 0) {
        consumeJson('srv/sucursal.php?' + params)
          .then((respuesta) => {
            muestraObjeto(forma, respuesta.body);
            pintaSucursal(respuesta.body);
          })
          .catch(muestraError);
      }
    "
  >
    <main>
      <form id="forma">
        <p style="display: none">
          <label class="md-filled-text-field">
            <input name="id" type="hidden" />
            <span>Id *</span>
            <small>Obligatorio</small>
          </label>
        </p>
      </form>

      <section id="detalle" class="detail">
        <div class="detail-header">
          <!-- GALERÍA DEL GYM -->
          <div class="swiper">
            <div class="swiper-wrapper" id="swiperWrapper"></div>
            <div class="swiper-pagination"></div>
          </div>

          <!-- INFO VISUAL -->
          <div class="detail-visual">
            <h1 id="nombre"></h1>
            <p class="meta" id="ubicacion"></p>

            <div class="location-block">
              <a
                class="map-link"
                id="ubicacionURL"
                target="_blank"
                rel="noopener"
              >
                <span class="material-symbols-outlined" style="font-size: 22px"
                  >location_on</span
                >
                Ver ubicación en Google Maps
              </a>
            </div>

            <!-- ACCESOS VISUALES -->
            <div class="info-actions">
              <a class="info-card" data-modal="horarios">
                <span class="material-symbols-outlined" style="font-size: 28px"
                  >schedule</span
                >
                Horarios
              </a>
              <a class="info-card" data-modal="membresias">
                <span class="material-symbols-outlined" style="font-size: 28px"
                  >credit_card</span
                >
                Membresías
              </a>
              <a class="info-card" data-modal="servicios">
                <span class="material-symbols-outlined" style="font-size: 28px"
                  >fitness_center</span
                >
                Servicios
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- MODAL DINÁMICO -->
    <div id="infoModal" class="modal">
      <div class="modal-content">
        <img id="modalImage" src="" alt="Información" />
      </div>
    </div>
  </body>

  <script>
    function pintaSucursal(data) {
      // EXTRAER VALORES REALES
      const nombre = data.nombre?.value ?? "";
      const ubicacion = data.ubicacion?.value ?? "";
      const ubicacionLink = data.ubicacionLink?.value ?? "";
      let imagenes = data.imagenes?.value ?? "[]";

      // TEXTO
      document.getElementById("nombre").textContent = `GYMAN ${nombre}`;
      document.getElementById("ubicacion").textContent = ubicacion;
      document.getElementById("ubicacionURL").href = ubicacionLink;

      // CARPETA
      const carpetaSucursal = normalizaNombre(`GYMAN ${nombre}`);
      const basePath = `img/sucursales/${carpetaSucursal}/`;

      // MODALES
      document.querySelector("[data-modal='membresias']").onclick = () =>
        abrirModal(`${basePath}2.png`);

      document.querySelector("[data-modal='horarios']").onclick = () =>
        abrirModal(`${basePath}3.png`);

      document.querySelector("[data-modal='servicios']").onclick = () =>
        abrirModal(`${basePath}4.png`);

      // IMÁGENES
      if (typeof imagenes === "string") {
        imagenes = JSON.parse(imagenes);
      }

      if (Array.isArray(imagenes) && imagenes.length > 0) {
        const wrapper = document.getElementById("swiperWrapper");
        wrapper.innerHTML = "";

        imagenes.forEach((src) => {
          const slide = document.createElement("div");
          slide.className = "swiper-slide";

          const img = document.createElement("img");
          img.src = src;
          img.loading = "lazy";
          img.alt = "Imagen de sucursal";

          slide.appendChild(img);
          wrapper.appendChild(slide);
        });

        inicializaSwiper();
      }
    }

    function inicializaSwiper() {
      new Swiper(".swiper", {
        loop: true,
        spaceBetween: 16,

        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },

        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });
    }

    function normalizaNombre(nombre) {
      return nombre
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9 ]/g, "")
        .trim();
    }

    function abrirModal(src) {
      const modal = document.getElementById("infoModal");
      const img = document.getElementById("modalImage");

      img.src = src;
      modal.style.display = "flex";
      document.body.classList.add("modal-open");
    }

    function cerrarModal() {
      const modal = document.getElementById("infoModal");
      modal.style.display = "none";
      document.body.classList.remove("modal-open");
    }

    document.getElementById("infoModal").addEventListener("click", (e) => {
      if (e.target.id === "infoModal") {
        cerrarModal();
      }
    });
  </script>
</html>
