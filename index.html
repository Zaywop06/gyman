<!doctype html>
<html lang="es" class="light dark">
  <head>
    <meta charset="UTF-8" />
    <title>GYMAN</title>

    <script src="js/registraServiceWorker.js"></script>

    <meta name="viewport" content="width=device-width" />
    <meta name="theme-color" content="#4caf50" />
    <link rel="icon" sizes="32x32" href="favicon.ico" />
    <link rel="manifest" href="site.webmanifest" />

    <link rel="stylesheet" href="css/estilos.css" />

    <script type="module" src="lib/js/consumeJson.js"></script>
    <script type="module" src="lib/js/muestraObjeto.js"></script>
    <script type="module" src="lib/js/muestraError.js"></script>

    <!-- AOS -->
    <link rel="stylesheet" href="css/aos.css" />
    <script src="js/aos.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        AOS.init({
          once: true,
          duration: 800,
          easing: "ease-out-cubic",
        });
      });
    </script>
  </head>

  <body
    onload="
      consumeJson('srv/sucursales.php')
        .then((respuesta) => {
          muestraObjeto(document, respuesta.body);
          AOS.refresh();
        })
        .catch(muestraError)
    ">
    <main>
      <header class="hero">
        <h1 data-aos="fade-up" data-aos-delay="100">
          ENCUENTRA TU GYMAN MÁS CERCANO,<br />SUS HORARIOS Y UBICACIÓN.
        </h1>
      </header>

      <section class="section">
        <div data-aos="fade-up" data-aos-offset="120">
          <h2>Sucursales</h2>
        </div>

        <div class="grid" id="lista">
          <progress max="100">Cargando…</progress>
        </div>
      </section>
    </main>
  </body>
</html>
