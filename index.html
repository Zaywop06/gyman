<!doctype html>
<html lang="es" class="light dark">
  <head>
    <meta charset="UTF-8" />
    <title>GYMan - PWA GYMan</title>

    <script src="js/registraServiceWorker.js"></script>

    <meta name="viewport" content="width=device-width" />
    <meta name="theme-color" content="#4caf50" />
    <link rel="icon" sizes="32x32" href="favicon.ico" />
    <link rel="manifest" href="site.webmanifest" />
    <script src="ungap/custom-elements.js"></script>

    <script type="module" src="js/configura.js"></script>
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="stylesheet" href="css/transicion_pestanas.css" />

    <script type="module" src="lib/js/muestraError.js"></script>
    <script type="module" src="js/bd/sucursalConsultaNoEliminados.js"></script>
    <script type="module" src="js/renderiza.js"></script>
    <script type="module" src="js/sincroniza.js"></script>
    <script type="module" src="js/esperaUnPocoYSincroniza.js"></script>
  </head>

  <body
    onload="
      sucursalConsultaNoEliminados()
        .then((sucursales) => {
          renderiza(lista, sucursales);
          sincroniza(lista);
        })
        .catch((error) => {
          muestraError(error);
          esperaUnPocoYSincroniza(lista);
        })
    "
  >
    <md-top-app-bar class="center-aligned" headline="h1Headline">
      <h1>GYMAN</h1>
    </md-top-app-bar>

    <main>
      <h1 class="titulo">INFORMACIÓN SUCURSALES 2026</h1>
      <h3 class="subtitulo">
        Conoce toda la información que necesites de tus sucursales.
      </h3>
      <div class="md-cards" id="lista">
        <progress max="100">Cargando…</progress>
      </div>

      <!-- <a
        type="button"
        class="md-fab-primary"
        href="agrega.html"
        style="
          position: fixed;
          bottom: 1rem;
          right: 1rem;
          display: flex;
          align-items: center;
          justify-content: center;
        "
      >
        <span class="material-symbols-outlined">add</span>
      </a> -->
    </main>
  </body>
</html>
